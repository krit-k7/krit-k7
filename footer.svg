  <!-- Row 6 -->
  <text x="30" y="315" font-family="Menlo, Consolas, monospace" font-size="15" fill="#c9d1d9">MongoDB</text>
  <rect x="330" y="301" width="480" height="14" rx="7" fill="#1b2030"/>
  <rect x="330" y="301" width="0" height="14" rx="7" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="336" dur="1.4s" begin="0.95s" fill="freeze"/>
