<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <rect width="900" height="400" rx="14" fill="#0A0C14"/>
  <text x="30" y="40" font-family="Menlo, Consolas, monospace" font-size="18" fill="#e6e9f0" font-weight="bold">Skill Proficiency</text>

  <!-- Row 1 -->
  <text x="30" y="90" font-family="Menlo, Consolas, monospace" font-size="15" fill="#c9d1d9">JavaScript / TypeScript</text>
  <rect x="330" y="76" width="480" height="14" rx="7" fill="#1b2030"/>
  <rect x="330" y="76" width="0" height="14" rx="7" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="408" dur="1.4s" begin="0.2s" fill="freeze"/>
  </rect>
  <text x="820" y="90" font-family="Menlo, Consolas, monospace" font-size="13" fill="#8a93a6">85%</text>

  <!-- Row 2 -->
  <text x="30" y="135" font-family="Menlo, Consolas, monospace" font-size="15" fill="#c9d1d9">React</text>
