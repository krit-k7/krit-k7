  <rect x="330" y="346" width="480" height="14" rx="7" fill="#1b2030"/>
  <rect x="330" y="346" width="0" height="14" rx="7" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="394" dur="1.4s" begin="1.1s" fill="freeze"/>
  </rect>
