  <!-- Row 5 -->
  <text x="30" y="270" font-family="Menlo, Consolas, monospace" font-size="15" fill="#c9d1d9">C</text>
  <rect x="330" y="256" width="480" height="14" rx="7" fill="#1b2030"/>
  <rect x="330" y="256" width="0" height="14" rx="7" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="312" dur="1.4s" begin="0.8s" fill="freeze"/>
  </rect>
