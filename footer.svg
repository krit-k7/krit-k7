    <animate attributeName="width" from="0" to="360" dur="1.4s" begin="0.5s" fill="freeze"/>
  </rect>
  <text x="820" y="180" font-family="Menlo, Consolas, monospace" font-size="13" fill="#8a93a6">75%</text>

  <!-- Row 4 -->
  <text x="30" y="225" font-family="Menlo, Consolas, monospace" font-size="15" fill="#c9d1d9">Python</text>
