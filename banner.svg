<svg viewBox="0 0 1000 70" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="30" x2="1000" y2="30" stroke="#1b2030" stroke-width="2"/>
  <circle cx="0" cy="30" r="5" fill="url(#pulseGrad)">
    <animateMotion path="M0,0 L1000,0" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <text x="500" y="58" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#5a6272">
    thanks for stopping by — now go build something
  </text>
</svg>
